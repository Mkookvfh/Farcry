name: Build PS2 game[span_3](start_span)[span_3](end_span)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain paths
        run: |
          echo "PS2DEV=$PS2DEV"
          echo "PS2SDK=$PS2SDK"
          ls "$PS2DEV" || true
          ls "$PS2DEV/gsKit" || true

      - name: Build
        run: make

      - name: Upload game file
        uses: actions/upload-artifact@v4
        with:
          name: outpost_island
          path: outpost_island.elf
